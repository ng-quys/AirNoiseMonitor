; ===================================================================
; AirNoiseMonitor Full - Wokwi + real ESP32 profiles
; ===================================================================

[platformio]
default_envs = wokwi

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv

lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^7.1.0
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit MPU6050
    adafruit/Adafruit NeoPixel

build_flags =
    -D CORE_DEBUG_LEVEL=1

[env:wokwi]
build_flags =
    ${env.build_flags}
    -D WOKWI_SIMULATION=1
    -D ENABLE_BLUETOOTH_PROVISIONING=0
    -D ENABLE_OTA=0
    -D PM25_SENSOR_MODE=0
    -D NOISE_SENSOR_MODE=0
    -D SOLAR_SENSOR_MODE=0

[env:esp32-real]
build_flags =
    ${env.build_flags}
    -D WOKWI_SIMULATION=0
    -D ENABLE_BLUETOOTH_PROVISIONING=1
    -D ENABLE_OTA=1
    -D PM25_SENSOR_MODE=1
    -D NOISE_SENSOR_MODE=1
    -D SOLAR_SENSOR_MODE=1
